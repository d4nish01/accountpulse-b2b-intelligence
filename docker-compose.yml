services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: accountpulse
      POSTGRES_PASSWORD: accountpulse
      POSTGRES_DB: accountpulse
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql://accountpulse:accountpulse@db:5432/accountpulse
    volumes:
      - ./sample_data:/sample_data:ro
    ports:
      - "8000:8000"
    depends_on:
      - db

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata:
